name: Freshness Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 1"
    - cron: "0 21 * 12,1 *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild source registry
        run: python scripts/build_source_registry.py

      - name: Refresh welfare resources
        run: python scripts/crawl_sources.py --sources data/sources.json --out data/resources.json

      - name: Convert reviewed foundation program pages
        run: python scripts/convert_candidate_programs.py --resources data/resources.json --candidates data/foundation-program-candidates.json data/foundation-program-candidates-batch-b.json data/foundation-program-candidates-batch-c.json data/foundation-program-candidates-batch-d.json data/foundation-program-candidates-batch-e.json data/foundation-program-candidates-batch-f.json data/foundation-program-candidates-batch-g.json data/foundation-program-candidates-batch-h.json data/foundation-program-candidates-batch-i.json --allowlist data/formal-program-allowlist.json --out data/resources.json

      - name: Check source freshness
        run: python scripts/check_freshness.py --sources data/sources.json --out data/freshness-report.json --timeout 5 --retries 0 --retry-sleep 0

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Verify static build
        run: node scripts/build_static.mjs

      - name: Commit changed data
        run: |
          git config user.name "welfare-resource-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources.json data/resources.json data/freshness-report.json data/formal-program-allowlist.json data/foundation-program-candidates*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh welfare resource data"
            git push
          else
            echo "No data changes to commit."
          fi
