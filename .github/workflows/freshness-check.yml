name: Freshness Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 1"
    - cron: "0 21 * 12,1 *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check source freshness
        run: python scripts/check_freshness.py --sources data/sources.json --out data/freshness-report.json

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Commit changed reports
        run: |
          git config user.name "welfare-resource-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freshness-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update freshness report"
            git push
          else
            echo "No freshness changes to commit."
          fi
